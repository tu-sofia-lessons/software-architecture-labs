name: verify

on:
  push:
    branches: ["week-*"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the week's check
        run: |
          cd "${GITHUB_REF_NAME:0:7}"          # week-NN, also for week-NN-punch
          if [ -f verify.py ]; then python verify.py; else python ladder.py; fi
